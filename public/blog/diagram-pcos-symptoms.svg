<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <filter id="box-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F1A0D" flood-opacity="0.04"/>
    </filter>
  </defs>
  
  <rect width="600" height="350" fill="#FCFAF6" rx="16"/>
  
  <text x="300" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#0F1A0D" text-anchor="middle">Understanding PCOS Symptoms</text>
  <text x="300" y="68" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#4D5A48" text-anchor="middle">A holistic look at how PCOS affects different aspects of metabolic &amp; hormonal health</text>

  <!-- Center Circle -->
  <circle cx="300" cy="195" r="45" fill="#3FA535" opacity="0.1"/>
  <circle cx="300" cy="195" r="35" fill="white" filter="url(#box-shadow)"/>
  <text x="300" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#3FA535" text-anchor="middle">PCOS</text>

  <!-- Sector 1: Cycles -->
  <g transform="translate(130, 110)" filter="url(#box-shadow)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="white" stroke="#3FA535" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#0F1A0D" text-anchor="middle">Irregular Cycles</text>
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="9" fill="#4D5A48" text-anchor="middle">
      <tspan x="0" dy="0">Delayed menstruation or</tspan>
      <tspan x="0" dy="11">anovulatory cycles.</tspan>
    </text>
  </g>
  <line x1="210" y1="110" x2="265" y2="165" stroke="#3FA535" stroke-dasharray="4" stroke-width="1.5"/>

  <!-- Sector 2: Hormones -->
  <g transform="translate(470, 110)" filter="url(#box-shadow)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="white" stroke="#0EA98B" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#0F1A0D" text-anchor="middle">Androgen Excess</text>
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="9" fill="#4D5A48" text-anchor="middle">
      <tspan x="0" dy="0">Acne breakout, hirsutism,</tspan>
      <tspan x="0" dy="11">and hair fall patterns.</tspan>
    </text>
  </g>
  <line x1="390" y1="110" x2="335" y2="165" stroke="#0EA98B" stroke-dasharray="4" stroke-width="1.5"/>

  <!-- Sector 3: Metabolic -->
  <g transform="translate(130, 280)" filter="url(#box-shadow)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="white" stroke="#0EA98B" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#0F1A0D" text-anchor="middle">Metabolic Resistance</text>
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="9" fill="#4D5A48" text-anchor="middle">
      <tspan x="0" dy="0">Insulin resistance, weight</tspan>
      <tspan x="0" dy="11">management challenges.</tspan>
    </text>
  </g>
  <line x1="210" y1="280" x2="265" y2="225" stroke="#0EA98B" stroke-dasharray="4" stroke-width="1.5"/>

  <!-- Sector 4: Emotional -->
  <g transform="translate(470, 280)" filter="url(#box-shadow)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="white" stroke="#3FA535" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#0F1A0D" text-anchor="middle">Emotional Wellness</text>
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="9" fill="#4D5A48" text-anchor="middle">
      <tspan x="0" dy="0">Mood fluctuations, fatigue,</tspan>
      <tspan x="0" dy="11">and sleeping issues.</tspan>
    </text>
  </g>
  <line x1="390" y1="280" x2="335" y2="225" stroke="#3FA535" stroke-dasharray="4" stroke-width="1.5"/>
</svg>
